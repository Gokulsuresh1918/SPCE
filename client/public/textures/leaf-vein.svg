  <!--
    Banana-leaf vein motif for section dividers. Ships at a visible stroke
    opacity so it reads in isolation (e.g. in /styleguide); at a real section
    divider, wrap it and apply opacity-[0.03] (3% max, per CLAUDE.md) rather
    than editing the strokes below.
