<svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 40 40" role="presentation" aria-hidden="true">
  <!--
    Kasavu gold-border motif — the woven gold-thread temple border on a
    mundu/settu-mundu, referenced sparingly on card edges. Tile horizontally
    (background-repeat: repeat-x) along a top or bottom edge, ~4-6px tall.
  -->
  <defs>
    <pattern id="kasavu-tile" width="40" height="40" patternUnits="userSpaceOnUse">
      <rect width="40" height="40" fill="none" />
      <path d="M0,32 L10,20 L20,32 L30,20 L40,32" fill="none" stroke="#D9A521" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
      <line x1="0" y1="36" x2="40" y2="36" stroke="#D9A521" stroke-width="1" stroke-opacity="0.6" />
    </pattern>
  </defs>
  <rect width="40" height="40" fill="url(#kasavu-tile)" />
</svg>
